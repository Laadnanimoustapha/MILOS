name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-pub

      - name: Show dependency sizes
        run: flutter pub deps --style=compact

      - name: Build optimized arm64 release APK
        run: >-
          flutter build apk --release --split-per-abi --target-platform android-arm64
          --obfuscate --split-debug-info=build/debug-info --tree-shake-icons

      - name: Copy APK to versions folder
        run: |
          mkdir -p versions
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk versions/Milos-arm64-v8a.apk

      - name: Commit APK to repository
        if: github.ref_type == 'branch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force versions/Milos-arm64-v8a.apk
          if git diff --cached --quiet; then
            echo "The versions APK is already up to date."
          else
            git commit -m "chore: update Android APK"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Publish APK to repository Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest \
            --title "Latest MILOS APK" \
            --notes "Latest arm64 Android APK built from the main branch." \
            --prerelease
          gh release upload latest versions/Milos-arm64-v8a.apk --clobber

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Milos-Android-APK
          path: versions/Milos-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 30
