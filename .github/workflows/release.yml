name: Release Versioned APK

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
      release_notes:
        description: 'Optional release notes'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version & prepare tag
        id: version
        run: |
          LINE=$(grep '^version:' pubspec.yaml)
          VER_PART=$(echo "$LINE" | sed 's/version:[[:space:]]*//' | cut -d'+' -f1)
          BUILD_PART=$(echo "$LINE" | sed 's/version:[[:space:]]*//' | cut -d'+' -f2)
          IFS='.' read -r MAJ MIN PAT <<< "$VER_PART"
          if [ "${{ inputs.bump }}" = "minor" ]; then
            MIN=$((MIN + 1))
            PAT=0
          else
            PAT=$((PAT + 1))
          fi
          NEW_VER="$MAJ.$MIN.$PAT"
          NEW_BUILD=$((BUILD_PART + 1))
          sed -i "s/^version:.*/version: $NEW_VER+$NEW_BUILD/" pubspec.yaml
          echo "NEW_VERSION=$NEW_VER" >> "$GITHUB_OUTPUT"
          echo "TAG=v$NEW_VER" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze & test
        run: |
          flutter analyze --no-pub
          flutter test

      - name: Build optimized split APKs
        run: >-
          flutter build apk --release --split-per-abi
          --obfuscate --split-debug-info=build/debug-info --tree-shake-icons
          --dart-define=APP_VERSION=${{ steps.version.outputs.NEW_VERSION }}

      - name: Commit version bump & push tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: release ${{ steps.version.outputs.TAG }}"
          git tag "${{ steps.version.outputs.TAG }}"
          git push origin HEAD --follow-tags

      - name: Create GitHub Release with APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="${{ inputs.release_notes }}"
          if [ -z "$NOTES" ]; then
            NOTES="Release ${{ steps.version.outputs.TAG }} of MILOS."
          fi
          gh release create "${{ steps.version.outputs.TAG }}" \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            --title "MILOS ${{ steps.version.outputs.TAG }}" \
            --notes "$NOTES" \
            --generate-notes
